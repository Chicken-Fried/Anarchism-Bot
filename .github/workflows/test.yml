name: Test SSH Connection

on:
  workflow_dispatch: # Permet de lancer le test manuellement depuis l'onglet Actions

jobs:
  test_ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Tester la connexion et le dossier
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEBIAN_HOST }}
          username: ${{ secrets.DEBIAN_USER }}
          key: ${{ secrets.GIT_PROJECTS }}
          port: ${{ secrets.DEBIAN_PORT }}
          script: |
            echo "--- Début du test ---"
            echo "Utilisateur actuel : $(whoami)"
            echo "Vérification du dossier du projet..."
            if [ -d "/home/edgar/docker-projects/bot-anarchism" ]; then
              echo "✅ Le dossier existe."
              cd /home/edgar/docker-projects/bot-anarchism
              ls -la
            else
              echo "❌ Le dossier /home/edgar/docker-projects/bot-anarchism n'existe pas !"
              mkdir -p /home/edgar/docker-projects/bot-anarchism
              echo "Dossier créé."
            fi
            echo "Vérification de Docker..."
            docker --version && echo "✅ Docker est installé." || echo "❌ Docker non trouvé."
            echo "--- Test terminé ---"