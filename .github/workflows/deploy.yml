name: Deploy Bot to Debian

on:
  push:
    branches:
      - master  # Se déclenche à chaque push sur la branche master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion SSH et déploiement
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/edgar/docker-projects/bot-anarchism
            cd /home/edgar/docker-projects/bot-anarchism
            
            # Si le dossier n'est pas encore un repo git, on l'initialise
            if [ ! -d ".git" ]; then
              git clone git@github.com:Chicken-Fried/Anarchism_BotDev.git .
            fi
            
            git fetch origin master
            git reset --hard origin/master
            
            docker compose up --build -d
            docker image prune -f