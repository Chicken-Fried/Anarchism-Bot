name: Deploy Bot to Debian

on:
  push:
    branches:
      - master  # Se déclenche à chaque push sur la branche master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion SSH et déploiement
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.109.136.176.42 }}
          username: ${{ secrets.edgar }}
          password: ${{ secrets.Juan-pablo1 }}
          port: ${{ secrets.3434 }}
          script: |
            cd /home/edgar/docker-projects/bot-anarchism
            git fetch origin master
            git reset --hard origin/master
            docker compose up --build -d
            docker image prune -f